<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="fc">
      <path d="M41,9 L41,30 Q41,33 39,36 L15,82 Q13,87 18,89 L82,89 Q87,87 85,82 L61,36 Q59,33 59,30 L59,9 Z"/>
    </clipPath>
    <linearGradient id="liqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6dd8f5"/>
      <stop offset="100%" stop-color="#1ab8e8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8eef8"/>
      <stop offset="60%" stop-color="#dff6fc"/>
      <stop offset="100%" stop-color="#b8e6f5"/>
    </linearGradient>
  </defs>

  <!-- Flask dark outline -->
  <path d="M41,9 L41,30 Q41,33 39,36 L15,82 Q13,87 18,89 L82,89 Q87,87 85,82 L61,36 Q59,33 59,30 L59,9 Z"
        fill="#16343f"/>

  <!-- Flask glass body -->
  <path d="M43,11 L43,30 Q43,34 41,37 L18,82 Q17,85 20,86 L80,86 Q83,85 82,82 L59,37 Q57,34 57,30 L57,11 Z"
        fill="url(#glassGrad)"/>

  <!-- Liquid fill -->
  <rect x="0" y="63" width="100" height="28" fill="url(#liqGrad)" clip-path="url(#fc)"/>

  <!-- Liquid surface -->
  <ellipse cx="50" cy="63" rx="31" ry="3.5" fill="#9ee8f8" clip-path="url(#fc)"/>

  <!-- Foam/bubbles on surface -->
  <ellipse cx="38" cy="63" rx="6" ry="4" fill="white" opacity="0.7" clip-path="url(#fc)"/>
  <ellipse cx="50" cy="62" rx="5" ry="3.5" fill="white" opacity="0.7" clip-path="url(#fc)"/>
  <ellipse cx="61" cy="63" rx="5" ry="3.5" fill="white" opacity="0.6" clip-path="url(#fc)"/>

  <!-- Bubbles in liquid -->
  <circle cx="38" cy="73" r="3"   fill="#9ee8f8" clip-path="url(#fc)"/>
  <circle cx="57" cy="69" r="2"   fill="#9ee8f8" clip-path="url(#fc)"/>
  <circle cx="68" cy="77" r="2.5" fill="#9ee8f8" clip-path="url(#fc)"/>

  <!-- Small bubbles rising -->
  <circle cx="47" cy="52" r="1.5" fill="#9ee8f8" clip-path="url(#fc)"/>
  <circle cx="52" cy="44" r="1"   fill="#9ee8f8" clip-path="url(#fc)"/>

  <!-- Glass highlight in neck -->
  <rect x="49" y="12" width="4" height="16" rx="2" fill="white" opacity="0.55"/>

  <!-- Flask rim outline -->
  <rect x="38" y="3" width="24" height="9" rx="4.5" fill="#16343f"/>
  <!-- Flask rim glass -->
  <rect x="40" y="4.5" width="20" height="6" rx="3.5" fill="#9ee8f8"/>
  <!-- Rim highlight -->
  <rect x="42" y="5.5" width="7" height="3" rx="1.5" fill="white" opacity="0.6"/>

  <!-- Checkmark dark outline -->
  <polyline points="19,64 35,80 79,31"
            fill="none" stroke="#16343f" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark green -->
  <polyline points="19,64 35,80 79,31"
            fill="none" stroke="#5ce61a" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark inner highlight -->
  <polyline points="19,64 35,80 79,31"
            fill="none" stroke="#8ff048" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"
            opacity="0.5"/>
</svg>
